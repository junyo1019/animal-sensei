<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ストーリーの絵</title>
<style>body{font-family:system-ui,sans-serif;background:#F6F3EA;color:#1F2A33;margin:0;padding:12px}h1{font-size:20px}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}figure{margin:0;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.12)}
img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#ddd}figcaption{padding:4px 6px;font-weight:700;text-align:center;font-size:12px}</style>
<h1>ストーリーの絵（全話）</h1><div class="g" id="o"></div>
<script>
(async()=>{const s=await (await fetch("index.html?"+Date.now())).text();
const A=JSON.parse(s.split("/*ART*/")[1]),st=JSON.parse(s.match(/ART_STYLE=("(?:[^"\\\\]|\\\\.)*")/)[1]),en=JSON.parse(s.match(/ART_END=("(?:[^"\\\\]|\\\\.)*")/)[1]);
const V="https://animal-sensei-voice.junyo1019.workers.dev/img?p=",o=document.getElementById("o");
for(const k in A){const f=document.createElement("figure");f.innerHTML=`<img alt=""><figcaption>${k}</figcaption>`;o.appendChild(f);
 await new Promise(r=>{const i=f.firstChild;i.onload=i.onerror=r;i.src=V+encodeURIComponent(st+A[k]+en);});}
document.title="done";})();
</script></html>
